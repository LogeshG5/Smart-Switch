# =====================================================================
# SYSTEM GENERAL & HARDWARE
# =====================================================================
# Enable POSIX API layer (required for standard sockets and time structures)
CONFIG_POSIX_API=y

# Enable General Purpose Input/Output driver (required for the boot button and relay)
CONFIG_GPIO=y

# Enable reboot APIs (required for sys_reboot in hardware long-press and web reset)
CONFIG_REBOOT=y

# Enable EventFD signaling (mandatory for HTTP Server background polling thread)
CONFIG_EVENTFD=y

# Generates mock entropy for security headers (useful during testing phase)
CONFIG_TEST_RANDOM_GENERATOR=y


# =====================================================================
# FILE SYSTEM & PERSISTENCE
# =====================================================================
# Enable the microcontroller flash driver layer
CONFIG_FLASH=y

# Enable flash partition mapping (exposes partition labels like storage or slot1)
CONFIG_FLASH_MAP=y

# Enable Non-Volatile Storage driver (wear-leveling key-value database over raw flash)
CONFIG_NVS=y

# Enable Zephyr settings subsystem (high-level config serialization)
CONFIG_SETTINGS=y

# Select NVS as the storage backend for the Settings subsystem
CONFIG_SETTINGS_NVS=y


# =====================================================================
# KERNEL THREADS & MEMORY ALLOCATION
# =====================================================================
# Set stack size for system work queue thread (handles delayed tasks)
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072

# Set stack size for background TCP connection processing tasks
CONFIG_NET_TCP_WORKQ_STACK_SIZE=2048

# Helps detect stack overflows during development by filling them with pattern data
CONFIG_INIT_STACKS=y

# Increase maximum POSIX virtual file descriptors (prevents eventfd socket exhaustion)
CONFIG_ZVFS_OPEN_MAX=32

# Max poll operations handled concurrently by Virtual File System layer
CONFIG_ZVFS_POLL_MAX=32


# =====================================================================
# LOGGING SUBSYSTEM
# =====================================================================
# Enable Zephyr's logging module
CONFIG_LOG=y

# Reserve log buffer memory
CONFIG_LOG_BUFFER_SIZE=4096

# Defer log printing to background thread (prevents logging from stalling time-sensitive code)
CONFIG_LOG_MODE_DEFERRED=y

# Enable verbose debugging logs inside the IP network stack
CONFIG_NET_LOG=y


# =====================================================================
# IP NETWORKING CORE
# =====================================================================
# Enable Zephyr's main network stack
CONFIG_NETWORKING=y

# Enable IPv4 support (mandatory for Local Network operations)
CONFIG_NET_IPV4=y

# Enable Transmission Control Protocol (required for HTTP Server)
CONFIG_NET_TCP=y

# Enable User Datagram Protocol (required for SNTP/DNS)
CONFIG_NET_UDP=y

# Enable POSIX socket abstraction wrapper around native IP stack
CONFIG_NET_SOCKETS=y

# Manage interface states (notifies us when WiFi connects or gets an IP)
CONFIG_NET_CONNECTION_MANAGER=y

# Max active concurrent socket contexts (MUST be high to support multiple web client assets)
CONFIG_NET_MAX_CONTEXTS=16

# Max simultaneous active network connections
CONFIG_NET_MAX_CONN=16

# Prevent Zephyr from automatically forcing random interface starts at boot
CONFIG_NET_CONFIG_AUTO_INIT=n


# =====================================================================
# NETWORK PACKET & BUFFER ALLOCATION (Tuned for Concurrency)
# =====================================================================
# Number of incoming network packet structures allocated
CONFIG_NET_PKT_RX_COUNT=16

# Number of outgoing network packet structures allocated
CONFIG_NET_PKT_TX_COUNT=16

# Number of incoming raw network buffer data blocks
CONFIG_NET_BUF_RX_COUNT=32

# Number of outgoing raw network buffer data blocks
CONFIG_NET_BUF_TX_COUNT=32


# =====================================================================
# WI-FI MANAGEMENT (Station + AP Modes)
# =====================================================================
# Enable native Wi-Fi drivers and API support
CONFIG_WIFI=y

# Enable Layer 2 Wi-Fi Management events (Connect/Disconnect events)
CONFIG_NET_L2_WIFI_MGMT=y

# Enable Wi-Fi Network Manager support
CONFIG_WIFI_NM=y

# Permit simultaneous Station & Soft-AP mode operation
CONFIG_WIFI_USAGE_MODE_STA_AP=y


# =====================================================================
# NETWORK MANAGEMENT EVENTS
# =====================================================================
# Enable Network Management core
CONFIG_NET_MGMT=y

# Enable L2 Network Management Event generation
CONFIG_NET_MGMT_EVENT=y

# Expose status payloads inside event callbacks (required for Wi-Fi status structures)
CONFIG_NET_MGMT_EVENT_INFO=y

# Length of net event queue (prevents events getting dropped during busy boots)
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16

# Event processing loop timeout limit in ms
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000

# Thread stack size of background network management handler
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096


# =====================================================================
# LOCAL INFRASTRUCTURE (DNS, DHCP, SNTP)
# =====================================================================
# Enable local DNS client (required to resolve NTP domains)
CONFIG_DNS_RESOLVER=y

# Enable local DHCPv4 client (required to obtain an IP in Station mode)
CONFIG_NET_DHCPV4=y

# Enable local DHCPv4 server (required to hand out IPs to clients in AP Mode)
CONFIG_NET_DHCPV4_SERVER=y

# Enable Simple Network Time Protocol client (required for time_sync)
CONFIG_SNTP=y


# =====================================================================
# HTTP WEB SERVER & UTILITIES
# =====================================================================
# Enable native HTTP Web Server subsystem
CONFIG_HTTP_SERVER=y

# Enable HTTP header processing parser
CONFIG_HTTP_PARSER=y

# Enable URL query parameter processing
CONFIG_HTTP_PARSER_URL=y

# Max web client sockets allowed to browse the dashboard at the same instant
CONFIG_HTTP_SERVER_MAX_CLIENTS=10

# Dedicated HTTP task thread stack size
CONFIG_HTTP_SERVER_STACK_SIZE=4096

# Enable REST wildcard matching (uses POSIX fnmatch for /api/schedules/*)
CONFIG_HTTP_SERVER_RESOURCE_WILDCARD=y

# Enable Zephyr JSON library (required for secure config & schedule parsing)
CONFIG_JSON_LIBRARY=y


# =====================================================================
# BOOTLOADER & OTA MANAGEMENT (MCUboot Support)
# =====================================================================
# Enable MCUboot integration
CONFIG_BOOTLOADER_MCUBOOT=y

# Enable MCUboot flash partition and firmware image manager APIs
CONFIG_IMG_MANAGER=y

# Enable flashing streamed binaries directly to Flash Slot 1
# CONFIG_FLASH_IMG=y

# Required by flash_img to permit buffer-sequential chunk writing
CONFIG_STREAM_FLASH=y
