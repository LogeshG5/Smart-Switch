CONFIG_POSIX_API=y
CONFIG_SNTP=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_WIFI_LOG_LEVEL_DBG=y
CONFIG_WIFI_LOG_LEVEL_ERR=y
CONFIG_WIFI_NM=y
CONFIG_WIFI_USAGE_MODE_STA_AP=y
CONFIG_WIFI=y
CONFIG_NET_LOG=y
CONFIG_LOG=y
CONFIG_NET_MAX_CONN=16
CONFIG_NET_MAX_CONTEXTS=8

CONFIG_NET_TCP=y
CONFIG_NET_TCP_WORKQ_STACK_SIZE=2048

CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16

CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_JSON_LIBRARY=y
CONFIG_HTTP_SERVER_MAX_CLIENTS=10

# 1. Enable EventFD signaling (Mandatory for HTTP Server)
CONFIG_EVENTFD=y

# 2. Increase maximum POSIX/Virtual File Descriptors
# The default is often too low, causing eventfd allocation to fail
CONFIG_ZVFS_OPEN_MAX=32
CONFIG_ZVFS_POLL_MAX=32

# 3. Increase Network Buffers and Sockets Allocation
# Concurrent HTTP requests and static files quickly consume buffers
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_NET_MAX_CONN=16

# 4. Increase HTTP Server Stack Size
# Parsing files, TLS (if enabled), and processing dynamic JSON requires more stack
CONFIG_HTTP_SERVER_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
# Enable wildcard support in URL matching (uses POSIX fnmatch)
CONFIG_HTTP_SERVER_RESOURCE_WILDCARD=y

# Enable Flash and Storage Subsystems
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# Enable Settings Subsystem with NVS Backend
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

CONFIG_GPIO=y
# Enable the sys_reboot system API
CONFIG_REBOOT=y
