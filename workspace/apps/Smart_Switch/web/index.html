<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Switch Settings</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-text: #333;
            --secondary-text: #666;
            --accent-color: #007bff;
            --border-color: #e0e0e0;
            --error-color: #d9534f;
            --success-color: #5cb85c;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-text);
        }

        .container {
            padding: 1rem;
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card h2 {
            margin: 0 0 1rem 0;
            font-size: 1.25rem;
        }

        .card-danger {
            border-color: var(--error-color);
        }

        .card-danger h2 {
            color: var(--error-color);
        }

        .button-danger {
            width: 100%;
            max-width: 350px;
            padding: 0.8rem 1rem;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            background-color: var(--error-color);
            border: none;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .button-danger:hover {
            background-color: #c9302c;
        }

        hr {
            border: none;
            border-top: 2px solid var(--border-color);
            margin: 2rem 0;
        }

        .footer-group {
            text-align: center;
            margin-top: -1rem;
            margin-bottom: 2rem;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"],
        input[type="time"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
            margin-bottom: 1rem;
            box-sizing: border-box;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        #status {
            min-height: 1.2em;
        }

        #status.success {
            color: var(--success-color);
        }

        #status.error {
            color: var(--error-color);
        }

        #device-state.success {
            font-weight: bold;
            color: var(--success-color);
        }

        #device-state.error {
            font-weight: bold;
            color: var(--error-color);
        }

        /* --- Button & Control Styles --- */
        button {
            cursor: pointer;
        }

        #save-settings-button {
            width: 100%;
            max-width: 350px;
            padding: 0.8rem 1rem;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            background-color: var(--accent-color);
            border: none;
            border-radius: 4px;
        }

        .outline-button {
            padding: 0.2rem 0.6rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
            background-color: transparent;
            border: 2px solid var(--accent-color);
            border-radius: 50%;
            line-height: 1;
        }

        .outline-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 0.5rem;
            margin-bottom: 1.25rem;
        }

        .button-group button {
            flex-grow: 1;
            padding: 0.7rem;
            border-radius: 4px;
            border: 1px solid;
            font-weight: bold;
            font-size: 1rem;
        }

        .button-primary {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .button-secondary {
            background-color: transparent;
            color: var(--primary-text);
            border-color: var(--secondary-text);
        }

        .input-inline-group {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .input-inline-group input[type="number"] {
            margin-bottom: 0;
            flex: 1;
        }

        .input-inline-group button {
            padding: 0.75rem 1.25rem;
            white-space: nowrap;
        }

        .action-btn {
            background: none;
            border: none;
            padding: 0.5rem;
        }

        .action-btn.edit {
            color: var(--accent-color);
        }

        .action-btn.remove {
            color: var(--error-color);
        }

        .action-btn:hover {
            opacity: 0.7;
        }

        /* --- Schedule Specific --- */
        .schedule-item {
            display: grid;
            grid-template-columns: 1fr auto auto;
            align-items: center;
            padding: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }

        .schedule-item:last-child {
            border-bottom: none;
        }

        .schedule-info p {
            margin: 0;
            color: var(--secondary-text);
        }

        .schedule-info p strong {
            color: var(--primary-text);
        }

        .schedule-form {
            border: 2px solid var(--accent-color);
            border-radius: 6px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .day-selector {
            display: flex;
            justify-content: space-between;
            gap: 4px;
            margin-bottom: 1rem;
        }

        .day-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.2rem;
            height: 2.2rem;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            user-select: none;
        }

        .day-toggle.active {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .day-toggle small {
            margin: 0;
            font-size: 0.7rem;
        }

        .time-row {
            display: flex;
            gap: 1rem;
        }

        .time-row div {
            flex: 1;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Smart Switch Settings</h1>
            <p id="status">Loading...</p>
            <p id="device-state"></p>
        </header>

        <main>
            <!-- SCHEDULE MANAGEMENT -->
            <div class="card">
                <div class="card-header">
                    <h2>Blocker Schedules</h2>
                    <button id="show-add-schedule-form-btn" class="outline-button" title="Add Schedule">+</button>
                </div>
                <div id="schedule-form-container"></div>
                <div id="schedule-list-container">
                    <p>Loading schedules...</p>
                </div>
            </div>

            <!-- CONTROL DEVICE -->
            <div class="card">
                <div class="card-header">
                    <h2>Control Device</h2>
                </div>
                
                <label>Manual Override</label>
                <div class="button-group">
                    <button id="btn-turn-on" class="button-primary">Turn On</button>
                    <button id="btn-turn-off" class="button-secondary">Turn Off</button>
                </div>

                <label for="temporary_allow_minutes">Allow Temporarily (Minutes)</label>
                <div class="input-inline-group">
                    <input id="temporary_allow_minutes" type="number" min="1" placeholder="e.g. 30" />
                    <button id="btn-allow-temp" class="button-primary">Allow</button>
                </div>
            </div>

            <hr />

            <!-- DEVICE SETTINGS -->
            <div class="card">
                <h2>General</h2>
                <label for="name">Device Name</label>
                <input id="name" type="text" placeholder="e.g., Living Room Lamp" />
            </div>
            <div class="card">
                <h2>WiFi Network</h2>
                <label for="wifi_ssid">SSID</label>
                <input id="wifi_ssid" type="text" placeholder="Your WiFi Name" autocomplete="off" />
                <label for="wifi_password">Password</label>
                <input id="wifi_password" type="password" />
            </div>
            <div class="card">
                <h2>Time & Safety</h2>
                <label for="timezone">Timezone</label>
                <input id="timezone" type="text" placeholder="e.g., America/New_York" />
                <label for="max_on_time_minutes">Auto-Off Timer (minutes)</label>
                <input id="max_on_time_minutes" type="number" min="0" placeholder="0" />
            </div>
            <div class="footer-group">
                <button id="save-settings-button">Save Device Settings</button>
            </div>

            <hr />

            <!-- Update Management -->
            <div class="card">
                <h2>Firmware Update (OTA)</h2>
                <p>Select a signed <code>zephyr.signed.bin</code> file to upload to the device.</p>
                
                <div class="file-upload-group">
                    <input type="file" id="ota-file-input" accept=".bin" />
                    <button id="ota-upload-btn" class="button-primary" style="margin-top: 10px;">Upload & Flash</button>
                </div>
                
                <div id="ota-progress-container" style="display: none; margin-top: 15px;">
                    <label>Uploading: <span id="ota-progress-text">0%</span></label>
                    <div style="background-color: var(--border-color); border-radius: 4px; height: 10px; overflow: hidden;">
                        <div id="ota-progress-bar" style="background-color: var(--accent-color); width: 0%; height: 100%; transition: width 0.1s;"></div>
                    </div>
                </div>
            </div>

            <!-- Reset Button -->
            <div class="card card-danger">
                <h2>Device Actions</h2>
                <p>Be careful, these actions are immediate and cannot be undone.</p>
                <div class="footer-group">
                    <button id="reboot-button" class="button-danger">Reboot Device</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // --- API ENDPOINTS ---
            const DEVICE_STATE_API = "/api/system/state";
            const CONTROL_API = "/api/system/control";
            const SETTINGS_API = "/api/settings";
            const SCHEDULES_API = "/api/schedules";
            const SCHEDULES_UPD_API = "/api/schedulesupd";

            // --- DOM ELEMENTS ---
            const statusEl = document.getElementById("status");
            const deviceStateEl = document.getElementById("device-state");
            const nameEl = document.getElementById("name");
            const ssidEl = document.getElementById("wifi_ssid");
            const passwordEl = document.getElementById("wifi_password");
            const timezoneEl = document.getElementById("timezone");
            const maxOnTimeEl = document.getElementById("max_on_time_minutes");
            const saveSettingsBtn = document.getElementById("save-settings-button");
            const showAddFormBtn = document.getElementById("show-add-schedule-form-btn");
            const scheduleFormContainer = document.getElementById("schedule-form-container");
            const scheduleListContainer = document.getElementById("schedule-list-container");

            // Control Elements
            const btnTurnOn = document.getElementById("btn-turn-on");
            const btnTurnOff = document.getElementById("btn-turn-off");
            const btnAllowTemp = document.getElementById("btn-allow-temp");
            const tempAllowInput = document.getElementById("temporary_allow_minutes");

            const setStatus = (message, isError = false) => {
                console.log(message);
                statusEl.textContent = message;
                statusEl.className = isError ? 'error' : 'success';
            };

            const deviceStateModule = (() => {
                const load = async () => {
                    try {
                        const response = await fetch(DEVICE_STATE_API);
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        const res = await response.json();
                        deviceStateEl.textContent = res.state ? "Device is Blocked" : "Device is Allowed";
                        deviceStateEl.className = res.state ? "error" : "success";
                    } catch (error) { setStatus(`Failed to load device state: ${error.message}`, true); }
                };
                return { load };
            })();

            // --- CONTROL DEVICE MODULE ---
            const deviceControlModule = (() => {
                const sendControlCommand = async (payload, successMsg) => {
                    setStatus("Sending command...", false);
                    try {
                        const response = await fetch(CONTROL_API, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(payload)
                        });
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        setStatus(successMsg, false);
                        await deviceStateModule.load();
                    } catch (error) {
                        setStatus(`Control failed: ${error.message}`, true);
                    }
                };

                return {
                    turnOn: () => sendControlCommand({ action: "on" }, "Device turned ON"),
                    turnOff: () => sendControlCommand({ action: "off" }, "Device turned OFF"),
                    allowTemp: () => {
                        const mins = Number(tempAllowInput.value);
                        if (!mins || mins <= 0) {
                            setStatus("Please enter a valid duration in minutes.", true);
                            return;
                        }
                        sendControlCommand({ action: "temporary_allow", duration_minutes: mins }, `Temporarily allowed for ${mins} minute(s).`);
                    }
                };
            })();

            // --- DEVICE SETTINGS MODULE ---
            const deviceSettingsModule = (() => {
                const load = async () => {
                    try {
                        const response = await fetch(SETTINGS_API);
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        const settings = await response.json();
                        nameEl.value = settings.name || "";
                        ssidEl.value = settings.wifi_ssid || "";
                        passwordEl.value = settings.wifi_password || "";
                        timezoneEl.value = settings.timezone || "";
                        maxOnTimeEl.value = settings.max_on_time_minutes || 0;
                    } catch (error) { setStatus(`Failed to load settings: ${error.message}`, true); }
                };

                const save = async () => {
                    setStatus("Saving device settings...", false);
                    const settings = {
                        name: nameEl.value, wifi_ssid: ssidEl.value, wifi_password: passwordEl.value,
                        timezone: timezoneEl.value, max_on_time_minutes: Number(maxOnTimeEl.value) || 0
                    };
                    try {
                        const response = await fetch(SETTINGS_API, {
                            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(settings)
                        });
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        setStatus("Device settings saved successfully!", false);
                    } catch (error) { setStatus(`Error saving settings: ${error.message}`, true); }
                };
                return { load, save };
            })();

            // --- SCHEDULE MANAGEMENT MODULE ---
            const scheduleModule = (() => {
                const weekdaysToMask = (weekdays) => weekdays.reduce((mask, day, i) => mask | (day << i), 0);
                const maskToWeekdays = (mask) => Array.from({ length: 7 }, (_, i) => !!(mask & (1 << i)));

                const load = async () => {
                    try {
                        const response = await fetch(SCHEDULES_API);
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        const schedules = await response.json();
                        renderList(schedules);
                        showAddFormBtn.disabled = schedules.length >= 8;
                    } catch (error) { setStatus(`Failed to load schedules: ${error.message}`, true); }
                };

                const format12Hr = (hour, minute) => {
                    const period = hour >= 12 ? 'PM' : 'AM';
                    const h12 = hour % 12 || 12;
                    return `${String(h12).padStart(2, '0')}:${String(minute).padStart(2, '0')} ${period}`;
                };

                const renderList = (schedules) => {
                    scheduleListContainer.innerHTML = "";
                    if (!schedules || schedules.length === 0) {
                        scheduleListContainer.innerHTML = "<p>No schedules defined.</p>";
                        return;
                    }
                    schedules.forEach((s, index) => {
                        const weekdays = maskToWeekdays(s.day_mask);
                        const item = document.createElement("div");
                        item.className = "schedule-item";
                        item.innerHTML = `
                            <div class="schedule-info">
                                <strong>${format12Hr(s.start_hour, s.start_minute)} - ${format12Hr(s.end_hour, s.end_minute)}</strong>
                                <p>${weekdays.map((a, i) => a ? ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'][i] : null).filter(Boolean).join(', ') || "Once"}</p>
                            </div>
                            <button class="action-btn edit" data-index="${index}" title="Edit"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></button>
                            <button class="action-btn remove" data-index="${index}" title="Remove"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg></button>
                        `;
                        item.querySelector('.edit').addEventListener('click', () => renderForm(s, index));
                        item.querySelector('.remove').addEventListener('click', () => remove(index));
                        scheduleListContainer.appendChild(item);
                    });
                };

                const renderForm = (schedule = null, index = -1) => {
                    const isEdit = index !== -1;
                    const s = schedule || { enabled: true, day_mask: 0, start_hour: 9, start_minute: 0, end_hour: 17, end_minute: 0 };
                    const weekdays = maskToWeekdays(s.day_mask);

                    scheduleFormContainer.innerHTML = `
                        <div class="schedule-form">
                            <h3>${isEdit ? `Edit Schedule #${index + 1}` : 'Add New Schedule'}</h3>
                            <div class="day-selector">
                                ${['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].map((day, i) => `<div class="day-toggle ${weekdays[i] ? 'active' : ''}" data-day="${i}"><small>${day}</small></div>`).join('')}
                            </div>
                            <div class="time-row">
                                <div><label>Start</label><input type="time" class="schedule-start" value="${String(s.start_hour).padStart(2, '0')}:${String(s.start_minute).padStart(2, '0')}"></div>
                                <div><label>End</label><input type="time" class="schedule-end" value="${String(s.end_hour).padStart(2, '0')}:${String(s.end_minute).padStart(2, '0')}"></div>
                            </div>
                            <div class="button-group">
                                <button class="button-primary">${isEdit ? 'Update' : 'Save'}</button>
                                <button class="button-secondary">Cancel</button>
                            </div>
                        </div>`;
                    showAddFormBtn.style.display = 'none';

                    const form = scheduleFormContainer.querySelector('.schedule-form');
                    form.querySelector('.button-primary').addEventListener('click', () => save(form, index));
                    form.querySelector('.button-secondary').addEventListener('click', () => {
                        scheduleFormContainer.innerHTML = "";
                        showAddFormBtn.style.display = 'block';
                    });
                    form.querySelectorAll('.day-toggle').forEach(t => t.addEventListener('click', () => t.classList.toggle('active')));
                };

                const save = async (form, index) => {
                    const isEdit = index !== -1;
                    const weekdays = Array.from(form.querySelectorAll('.day-toggle')).map(t => t.classList.contains('active'));
                    const [start_hour, start_minute] = form.querySelector('.schedule-start').value.split(':').map(Number);
                    const [end_hour, end_minute] = form.querySelector('.schedule-end').value.split(':').map(Number);

                    const scheduleData = { enabled: true, day_mask: weekdaysToMask(weekdays), start_hour, start_minute, end_hour, end_minute };

                    try {
                        const url = isEdit ? `${SCHEDULES_UPD_API}/${index}` : SCHEDULES_API;
                        const method = isEdit ? 'PUT' : 'POST';
                        const response = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(scheduleData) });
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        setStatus(`Schedule ${isEdit ? 'updated' : 'added'} successfully!`, false);
                        scheduleFormContainer.innerHTML = "";
                        showAddFormBtn.style.display = 'block';
                        await load();
                    } catch (error) { setStatus(`Error saving schedule: ${error.message}`, true); }
                };

                const remove = async (index) => {
                    if (!confirm(`Are you sure you want to delete Schedule #${index + 1}?`)) return;
                    try {
                        const response = await fetch(`${SCHEDULES_UPD_API}/${index}`, { method: 'DELETE' });
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        setStatus(`Schedule #${index + 1} deleted.`, false);
                        await load();
                    } catch (error) { setStatus(`Error deleting schedule: ${error.message}`, true); }
                };

                return { load, renderForm };
            })();

            // --- SYSTEM ACTIONS ---
            const rebootBtn = document.getElementById("reboot-button");

            const handleReboot = async () => {
                    if (!confirm("Are you sure you want to reboot the device? Connection will be lost.")) {
                        return;
                    }

                setStatus("Sending reboot command...", false);
                try {
                    const response = await fetch("/api/system/reset", { method: 'POST' });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    setStatus("Reboot command accepted. The device is restarting...", false);
                    rebootBtn.disabled = true;
                } catch (error) {
                    setStatus(`Error sending reboot command: ${error.message}`, true);
                }
            };

	    if (rebootBtn) {
	        rebootBtn.addEventListener('click', handleReboot);
	    }
            // --- OTA FIRMWARE UPLOAD ---
            const otaFileInput = document.getElementById("ota-file-input");
            const otaUploadBtn = document.getElementById("ota-upload-btn");
            const otaProgressContainer = document.getElementById("ota-progress-container");
            const otaProgressBar = document.getElementById("ota-progress-bar");
            const otaProgressText = document.getElementById("ota-progress-text");

            const handleOtaUpload = async () => {
                const file = otaFileInput.files[0];
                if (!file) {
                    alert("Please select a valid .bin firmware file first!");
                    return;
                }

                if (!confirm(`Are you sure you want to flash "${file.name}" (${(file.size / 1024).toFixed(1)} KB)?`)) {
                    return;
                }
                otaUploadBtn.disabled = true;
                otaFileInput.disabled = true;
                otaProgressContainer.style.display = "block";
                setStatus("Preparing OTA stream...", false);

                const reader = new FileReader();
                reader.onload = async (e) => {
                    const arrayBuffer = e.target.result;
                    const totalSize = arrayBuffer.byteLength;
                    const chunkSize = 1024;
                    let offset = 0;

                    try {
                        let initResponse = await fetch("/api/ota/start", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ size: totalSize })
                        });
                        if (!initResponse.ok) throw new Error("Could not initialize OTA session.");

                        while (offset < totalSize) {
                            const chunk = arrayBuffer.slice(offset, offset + chunkSize);
                            let uploadResponse = await fetch("/api/ota/upload", {
                                method: "POST",
                                headers: { "Content-Type": "application/octet-stream" },
                                body: chunk
                            });

                            if (!uploadResponse.ok) throw new Error(`Upload failed at offset ${offset}`);

                            offset += chunk.byteLength;
                            const percent = Math.round((offset / totalSize) * 100);
                            otaProgressBar.style.width = `${percent}%`;
                            otaProgressText.textContent = `${percent}%`;
                        }

                        setStatus("Flash complete! Validating image... Device will reboot automatically in 5 seconds.", false);
                        await fetch("/api/ota/finish", { method: "POST" });

                        setTimeout(() => { window.location.reload(); }, 5000);

                    } catch (err) {
                        setStatus(`OTA Failed: ${err.message}`, true);
                        otaUploadBtn.disabled = false;
                        otaFileInput.disabled = false;
                    }
                };
                reader.readAsArrayBuffer(file);
            };

            if (otaUploadBtn) otaUploadBtn.addEventListener("click", handleOtaUpload);

            // --- EVENT LISTENERS & INITIALIZATION ---
            btnTurnOn.addEventListener("click", deviceControlModule.turnOn);
            btnTurnOff.addEventListener("click", deviceControlModule.turnOff);
            btnAllowTemp.addEventListener("click", deviceControlModule.allowTemp);

            saveSettingsBtn.addEventListener('click', deviceSettingsModule.save);
            showAddFormBtn.addEventListener('click', () => scheduleModule.renderForm());

            setStatus("Loading all configurations...", false);
            Promise.all([scheduleModule.load(), deviceSettingsModule.load(), deviceStateModule.load()]).then(() => {
                setStatus("Configuration loaded.", false);
            });
        });
    </script>
</body>

</html>
